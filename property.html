<!DOCTYPE html>

<title>Dormly | Property Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/style.css">
<style>


.container{
max-width:1100px;
margin:40px auto;
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}



.property-image{

width:100%;
height:450px;
object-fit:cover;
border-radius:16px;

}



.details{

margin-top:30px;

}

.details h1{

color:var(--primary);
margin-bottom:15px;

}

.price{

font-size:30px;
color:var(--price);
font-weight:bold;
margin-bottom:20px;

}

.info{

line-height:2;
font-size:18px;

}

.description{

margin-top:25px;
line-height:1.8;

}

.bookBtn{

margin-top:35px;
width:100%;
padding:16px;
background:var(--primary);
color:white;
font-size:18px;
font-weight:bold;
border:none;
border-radius:6px;
cursor:pointer;

}

.bookBtn:hover{

background:var(--primary-dark);

}

.loading{

text-align:center;
font-size:22px;
padding:60px;
color:var(--muted);

}

@media(max-width:900px){

.container{

margin:20px;

}

.property-image{

height:250px;

}

}
</style>

</head>

<body onload="protectPage()" data-require="any">
<div id="guard-notice">Loading your account...</div>
<script>
setTimeout(function(){
  var n=document.getElementById('guard-notice');
  if(n && !document.body.classList.contains('auth-ready')){
    n.className='error';
    n.innerHTML='This page could not finish loading.<br><br>Check that the <b>js</b> folder (with <b>guard.js</b> and <b>firebase.js</b>) was uploaded, that you opened the site from its web address (not by double-clicking the file), then <a href="login.html">log in again</a>.';
  }
},6000);
</script>
