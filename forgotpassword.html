<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dormly - Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
* {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--blue-bright), var(--blue-soft));
            padding: 20px;
        }

        .forgot-container {
            width: 750px;
            max-width: 100%;
            min-height: 480px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
        }

        

        .forgot-left {
            width: 42%;
            background: var(--blue-bright);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 45px;
        }

        .forgot-left h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .forgot-left p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .dormly-logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 60px;
        }

        

        .forgot-right {
            width: 58%;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .forgot-right h2 {
            font-size: 30px;
            color: var(--text);
            margin-bottom: 12px;
        }

        .forgot-description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: var(--blue-bright);
            box-shadow: 0 0 0 2px rgba(43, 111, 255, 0.1);
        }

        .reset-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: var(--blue-bright);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-button:hover {
            background: var(--blue-bright-dark);
        }

        #resetMessage {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-login {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: var(--blue-bright);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        

        @media (max-width: 650px) {

            .forgot-container {
                flex-direction: column;
            }

            .forgot-left,
            .forgot-right {
                width: 100%;
            }

            .forgot-left {
                padding: 30px;
                min-height: 190px;
            }

            .dormly-logo {
                margin-bottom: 25px;
            }

            .forgot-left h1 {
                font-size: 28px;
            }

            .forgot-right {
                padding: 35px 30px;
            }
        }
</style>
</head>

<body>

    <div class="forgot-container">

        <!-- LEFT SIDE -->

        <div class="forgot-left">

            <div class="dormly-logo">
                Dormly
            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>Reset your password.</h1>

            <p>
                Don't worry, it happens. Enter your email address
                and we'll help you get back into your Dormly account.
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="forgot-right">

            <h2>Forgot Password?</h2>

            <p class="forgot-description">
                Enter the email address connected to your Dormly account.
                
            </p>


            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="resetEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="reset-button">
                    Send Reset Link
                </button>

            </form>


            <p id="resetMessage"></p>


            <a
                href="login.html"
                class="back-login">
                ← Back to Login
            </a>

        </div>

    </div>


    <script
        type="module"
        src="js/script.js">
    </script>

<script type="module" src="js/guard.js"></script>
</body>
</html>
