document.getElementById("loginForm").addEventListener("submit", function(e){

</script>

<script>
// If the site scripts have not loaded, say exactly why instead of silently reloading the page
(function(){
  var f=document.getElementById("loginForm");
  if(!f) return;

  function show(text){
    var b=document.getElementById("formMessage");
    b.textContent=text; b.style.display="block";
  }

  function diagnose(){
    if(location.protocol==="file:"){
      show("PROBLEM FOUND: you opened this page by double-clicking the file (the address starts with file://). Login only works from a web address. Upload the site to GitHub Pages / Firebase Hosting, or for testing run  python -m http.server  in the site folder and open http://localhost:8000");
      return;
    }
    fetch("js/script.js",{cache:"no-store"}).then(function(r){
      if(!r.ok){
        show("PROBLEM FOUND: the file js/script.js is missing on your website (error "+r.status+"). The js folder was not uploaded. Upload the whole js folder next to the HTML files and try again.");
        return;
      }
      return fetch("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",{mode:"no-cors"}).then(function(){
        show("js/script.js is there but did not run. Press F12, open the Console tab and tell me the red error you see. (Also try a hard refresh with Ctrl+Shift+R in case your browser kept an old copy.)");
      },function(){
        show("PROBLEM FOUND: your browser cannot reach Google's Firebase servers. Check your internet connection and turn off any ad blocker or VPN for this site, then refresh.");
      });
    },function(){
      show("Could not check the site files. Check your internet connection and refresh.");
    });
  }

  f.addEventListener("submit",function(e){
    if(typeof window.login!=="function"){
      e.preventDefault();
      show("Checking what went wrong...");
      diagnose();
    }
  });
})();
</script>
<script type="module" src="js/guard.js"></script>
